AWSTemplateFormatVersion: '2010-09-09'

Description: 'Root stack that deploys an S3 bucket through a nested stack and an optional SES email identity'

Conditions:
  CreateSesIdentity: !Not [!Equals [!Ref SesEmailIdentity, ""]]

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "SES Email Identity Configuration"
        Parameters:
          - SesEmailIdentity
      - Label:
          default: "Common Configuration"
        Parameters:
          - ProjectName
          - Environment
          - CiSuffix
    ParameterLabels:
      SesEmailIdentity:
        default: "SES Email Identity (Email Address or Domain)"
      ProjectName:
        default: "Project Name"
      Environment:
        default: "Environment"
      CiSuffix:
        default: "CI Suffix"

Parameters:
  ProjectName:
    Type: String
    Description: "Project name used as a prefix for resource naming"
    MinLength: 1
    MaxLength: 64
    AllowedPattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
    ConstraintDescription: "Must start and end with a lowercase letter or number and contain only lowercase letters, numbers and hyphens"

  Environment:
    Type: String
    Description: "Deployment environment label (for example devl, stag, prod)"
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "^[a-z0-9]+$"
    ConstraintDescription: "Must contain only lowercase letters and numbers"

  CiSuffix:
    Type: String
    Default: ""
    MaxLength: 16
    AllowedPattern: "^$|^[a-z0-9-]+$"
    ConstraintDescription: "Must be empty or contain only lowercase letters, numbers and hyphens"
    Description: "Optional suffix for CI/CD deployments so test stacks do not collide. Leave empty outside CI."

  SesEmailIdentity:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$|^([a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}$"
    ConstraintDescription: "Must be an email address (user@example.com) or a domain name (example.com), or empty to skip SES identity creation"
    Description: "Optional SES email identity. Use an email address (a verification email is sent to it) or a domain (DNS verification records are required). Leave empty to skip."

Resources:
  SesEmailIdentityResource:
    Type: AWS::SES::EmailIdentity
    Condition: CreateSesIdentity
    Metadata:
      com.aws.cloudformation:
        Context:
          why: "Registers an optional SES email identity (an email address or a domain) so this account can send email from it. Created only when SesEmailIdentity is non-empty."
          trust:
            src: authored
            conf: high
    Properties:
      EmailIdentity: !Ref SesEmailIdentity
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CiSuffix
          Value: !Ref CiSuffix

Outputs:
  SesEmailIdentityName:
    Condition: CreateSesIdentity
    Description: "SES email identity (address or domain) created by this stack"
    Value: !Ref SesEmailIdentityResource
